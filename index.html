<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Drill · Práctica de inglés</title>
<meta name="description" content="Practica pronombres, modales y auxiliares. Diez aciertos seguidos dominan cada palabra; un error reinicia su contador.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#5b5bd6">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{--paper:#f6f7fb;--card:#fff;--ink:#1b1f2a;--muted:#697386;--faint:#98a0b0;--line:#e4e7ef;--iris:#5b5bd6;--iris2:#7575e8;--soft:#eeeeff;--good:#168a46;--goodsoft:#e9f7ee;--bad:#cf3030;--badsoft:#fff0f0;--shadow:0 1px 2px #1b1f2a0a,0 16px 44px #1b1f2a12;--r:16px}
@media(prefers-color-scheme:dark){:root{--paper:#13151b;--card:#1b1e26;--ink:#eef0f5;--muted:#a0a8b8;--faint:#727b8d;--line:#303541;--iris:#9292ff;--iris2:#ababff;--soft:#292940;--good:#55d989;--goodsoft:#173323;--bad:#ff7d7d;--badsoft:#3b1c20;--shadow:0 16px 44px #0006}}
:root[data-theme=light]{--paper:#f6f7fb;--card:#fff;--ink:#1b1f2a;--muted:#697386;--faint:#98a0b0;--line:#e4e7ef;--iris:#5b5bd6;--iris2:#7575e8;--soft:#eeeeff;--good:#168a46;--goodsoft:#e9f7ee;--bad:#cf3030;--badsoft:#fff0f0}
:root[data-theme=dark]{--paper:#13151b;--card:#1b1e26;--ink:#eef0f5;--muted:#a0a8b8;--faint:#727b8d;--line:#303541;--iris:#9292ff;--iris2:#ababff;--soft:#292940;--good:#55d989;--goodsoft:#173323;--bad:#ff7d7d;--badsoft:#3b1c20}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:1100px;margin:auto;padding:26px 20px calc(64px + env(safe-area-inset-bottom))}button,input{font:inherit}button{color:inherit}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{border:0;background:none;cursor:pointer;text-align:left;padding:0}.brand h1{font-size:1.35rem;margin:0;letter-spacing:-.02em}.brand b{color:var(--iris)}.brand p{margin:3px 0 0;color:var(--muted);font-size:.82rem}.tools{display:flex;gap:8px}.tool{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.tool:hover{border-color:var(--iris)}[hidden]{display:none!important}.crumb{display:flex;align-items:center;gap:8px;margin:0 0 16px;color:var(--muted);font-size:.85rem}.crumb button{border:0;background:none;color:var(--iris);cursor:pointer;padding:0}.hero{padding:22px 0 30px}.eyebrow{color:var(--iris);font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:.72rem}.hero h2{font:700 clamp(2rem,5vw,3.5rem)/1.08 Georgia,serif;letter-spacing:-.035em;max-width:720px;margin:9px 0 12px}.hero p{color:var(--muted);max-width:660px;font-size:1.03rem}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.menu-card{position:relative;overflow:hidden;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px;min-height:210px;transition:.15s}.menu-card:hover{transform:translateY(-2px);border-color:var(--iris)}.menu-card .icon{display:grid;place-items:center;width:46px;height:46px;background:var(--soft);color:var(--iris);border-radius:13px;font-weight:800}.menu-card h3{font:700 1.45rem Georgia,serif;margin:30px 0 7px}.menu-card p{color:var(--muted);margin:0;max-width:440px}.menu-card .arrow{position:absolute;right:24px;top:24px;color:var(--iris);font-size:1.3rem}.subintro{margin:8px 0 22px}.subintro h2{font:700 2rem Georgia,serif;margin:0 0 6px}.subintro p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}.card,.rail{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.card{padding:27px}.rail{padding:20px;max-height:calc(100vh - 130px);overflow:auto;position:sticky;top:18px}.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.pill{color:var(--iris);background:var(--soft);border-radius:999px;padding:5px 11px;font-size:.75rem;font-weight:700}.streak{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}.sentence{font:1.72rem/1.42 Georgia,serif;margin:0 0 24px}.sentence .es{display:block;font:italic .92rem system-ui;color:var(--faint);margin-top:10px}.blank{display:inline-block;min-width:2.4em;text-align:center;border-bottom:3px solid var(--iris);color:var(--iris);padding:0 .12em;font-weight:700}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;text-align:left;display:flex;gap:10px;align-items:center}.opt:hover:not(:disabled){border-color:var(--iris)}.opt.correct{border-color:var(--good);background:var(--goodsoft);color:var(--good);font-weight:700}.opt.wrong{border-color:var(--bad);background:var(--badsoft);color:var(--bad);font-weight:700}.opt.dim{opacity:.45}.key{font-size:.7rem;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px}.feedback{min-height:52px;margin-top:19px}.fb{display:flex;align-items:center;gap:14px}.fb>div{flex:1}.good{color:var(--good)}.bad{color:var(--bad)}.tip{color:var(--muted);font-size:.84rem;margin-top:3px}.primary{cursor:pointer;border:0;border-radius:10px;background:var(--iris);color:#fff;padding:10px 18px;font-weight:700}.primary:hover{background:var(--iris2)}.rail h3{text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:.74rem;margin:0}.summary{color:var(--muted);font-size:.84rem;margin:4px 0 15px}.prow{display:grid;grid-template-columns:105px 1fr 34px;align-items:center;gap:8px;padding:4px 0}.word{font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:7px;background:var(--line);border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--iris)}.cnt{text-align:right;color:var(--muted);font-size:.74rem}.prow.done .word,.prow.done .cnt{color:var(--good)}.prow.done .bar i{background:var(--good)}.cat{color:var(--faint);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;margin:13px 0 4px}.formlabel{display:block;color:var(--muted);font-size:.82rem;margin:0 0 7px}.answer{width:100%;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);padding:14px 15px;font-size:1.08rem;outline:none}.answer:focus{border-color:var(--iris);box-shadow:0 0 0 3px var(--soft)}.answer.correct{border-color:var(--good);background:var(--goodsoft)}.answer.wrong{border-color:var(--bad);background:var(--badsoft)}.formrow{display:flex;gap:10px}.formrow .answer{flex:1}.pron{color:var(--muted);margin:-13px 0 20px;font-size:.87rem}.done{text-align:center;padding:24px}.done .trophy{font-size:2.4rem}.done h2{font:700 2rem Georgia,serif;margin:8px}.loading,.error{text-align:center;color:var(--muted);padding:42px}.note{color:var(--faint);font-size:.78rem;margin:18px 2px}.dots{display:inline-flex;gap:3px;margin:0 4px}.dots i{width:7px;height:7px;background:var(--line);border-radius:50%}.dots i.on{background:var(--iris)}
@media(max-width:830px){.grid{grid-template-columns:1fr}.rail{position:static;max-height:none}.menu{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:18px 14px 50px}.brand p{display:none}.card{padding:21px 18px}.options{grid-template-columns:1fr}.sentence{font-size:1.42rem}.formrow{flex-direction:column}.fb{align-items:flex-start;flex-direction:column}.primary{width:100%}.menu-card{min-height:190px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="brandBtn"><h1>English <b>Drill</b></h1><p>10 aciertos dominan · 1 error reinicia</p></button>
    <div class="tools"><button class="tool" id="installBtn" hidden>⬇ Instalar</button><button class="tool" id="themeBtn" title="Cambiar tema">◐</button><button class="tool" id="resetBtn" hidden>↻ Reiniciar</button></div>
  </header>
  <div id="app"></div>
</div>
<script>
(function(){
"use strict";
var GOAL=10,screen="home",mode=null,pronounData=null,modalData=null,current=null,answered=false,lastId=null;
var app=document.getElementById("app"),resetBtn=document.getElementById("resetBtn");
var progress={pronouns:{},modals:{}};
var KEYS={pronouns:"pronounDrill.v1",modals:"englishDrill.modals.v1"};
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shuffle(a){a=a.slice();for(var i=a.length-1;i;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function normalize(v){return String(v).trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ")}
function accepted(item,value){var v=normalize(value),parts=item.english.split("/").map(normalize);return v===normalize(item.english)||parts.indexOf(v)>=0}
function load(key,target,items){try{var s=JSON.parse(localStorage.getItem(key)||"{}");items.forEach(function(x){target[x.id]=typeof s[x.id]==="number"?Math.max(0,Math.min(GOAL,s[x.id]|0)):0})}catch(e){items.forEach(function(x){target[x.id]=0})}}
function save(kind){try{localStorage.setItem(KEYS[kind],JSON.stringify(progress[kind]))}catch(e){}}
function crumb(label){return '<nav class="crumb"><button data-go="home">Inicio</button><span>›</span><span>'+esc(label)+'</span></nav>'}
function home(){
 screen="home";mode=null;current=null;resetBtn.hidden=true;
 app.innerHTML='<section class="hero"><div class="eyebrow">Práctica personalizada</div><h2>Construye tu inglés, palabra por palabra.</h2><p>Elige un tema. Cada palabra se domina con 10 respuestas correctas consecutivas; si fallas, solo su contador vuelve a cero.</p></section><section class="menu"><button class="menu-card" data-open="pronouns"><span class="icon">PR</span><span class="arrow">→</span><h3>Pronombres</h3><p>Completa frases eligiendo el pronombre correcto en contexto.</p></button><button class="menu-card" data-open="modals"><span class="icon">MA</span><span class="arrow">→</span><h3>Modales y auxiliares</h3><p>Practica 19 palabras con autocompletado y relación de traducciones.</p></button></section>';
}
function modalMenu(){
 screen="modal-menu";mode=null;current=null;resetBtn.hidden=true;
 app.innerHTML=crumb("Modales y auxiliares")+'<section class="subintro"><h2>¿Cómo quieres practicar?</h2><p>Los dos ejercicios comparten el mismo progreso por palabra.</p></section><section class="menu"><button class="menu-card" data-mode="complete"><span class="icon">Aa</span><span class="arrow">→</span><h3>Autocompletar palabras</h3><p>Lee la traducción y el ejemplo, luego escribe el modal o auxiliar en inglés.</p></button><button class="menu-card" data-mode="match"><span class="icon">↔</span><span class="arrow">→</span><h3>Relacionar traducción</h3><p>Elige la traducción correcta para cada palabra en inglés.</p></button></section>';
}
function start(kind,newMode){
 screen=kind;mode=newMode||"choice";answered=false;lastId=null;resetBtn.hidden=false;next();
}
function items(){return screen==="pronouns"?pronounData.pronouns:modalData.items}
function prog(){return progress[screen]}
function pending(){return items().filter(function(x){return prog()[x.id]<GOAL})}
function next(){
 var pool=pending();answered=false;
 if(!pool.length){current=null;renderDone();return}
 var choices=pool.length>1&&lastId?pool.filter(function(x){return x.id!==lastId}):pool;
 var item=choices[Math.floor(Math.random()*choices.length)];lastId=item.id;
 if(screen==="pronouns"){
   var sen=item.sentences[Math.floor(Math.random()*item.sentences.length)];
   var optionPool=(pronounData.groups[item.group]||[item.answer]).slice();if(optionPool.indexOf(item.answer)<0)optionPool.push(item.answer);
   current={item:item,sentence:sen,options:shuffle(optionPool)};
 }else{
   var examples=item.examples||[{answer:item.english,en:item.exampleEn,es:item.exampleEs}];
   var example=examples[Math.floor(Math.random()*examples.length)];
   var opts=shuffle([item].concat(shuffle(modalData.items.filter(function(x){return x.id!==item.id})).slice(0,3))).map(function(x){return {id:x.id,value:x.spanish}});
   current={item:item,example:example,options:shuffle(opts)};
 }
 renderExercise();
}
function dots(n){var s='<span class="dots">';for(var i=0;i<GOAL;i++)s+='<i class="'+(i<n?"on":"")+'"></i>';return s+'</span>'}
function shell(body,label){app.innerHTML=crumb(label)+'<div class="grid"><main class="card" id="quiz">'+body+'</main><aside class="rail" id="rail"></aside></div><p class="note">Tu progreso se guarda únicamente en este dispositivo.</p>';renderRail()}
function renderExercise(){
 var x=current.item,n=prog()[x.id],head='<div class="qhead"><span class="pill">'+esc(screen==="pronouns"?x.label:(mode==="complete"?"Autocompletar":"Relacionar"))+'</span><span class="streak">Racha '+dots(n)+n+'/'+GOAL+'</span></div>';
 if(screen==="pronouns"){
   var parts=String(current.sentence.en).split("___"),sentence=parts.map(esc).join('<span class="blank">?</span>')+'<span class="es">'+esc(current.sentence.es)+'</span>';
   shell(head+'<div class="sentence">'+sentence+'</div>'+optionButtons(current.options.map(function(v){return {id:v,value:v}}))+'<div class="feedback" id="feedback"></div>',"Pronombres");
 }else if(mode==="match"){
   shell(head+'<div class="sentence">'+esc(x.english)+'<span class="es">Pronunciación aproximada: '+esc(x.pronunciation)+'</span></div>'+optionButtons(current.options)+'<div class="feedback" id="feedback"></div>',"Modales · Relacionar");
 }else{
   var exampleParts=String(current.example.en).split(new RegExp("\\b"+current.example.answer.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i"));
   var exampleBlank=exampleParts.length>1?exampleParts.map(esc).join('<span class="blank">?</span>'):esc(current.example.en);
   shell(head+'<div class="sentence">'+exampleBlank+'<span class="es">'+esc(current.example.es)+'</span></div><p class="formlabel">Escribe la palabra o expresión que falta en inglés</p><form id="answerForm" class="formrow"><input class="answer" id="answerInput" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Respuesta en inglés"><button class="primary" type="submit">Comprobar</button></form><div class="feedback" id="feedback"></div>',"Modales · Autocompletar");
   document.getElementById("answerInput").focus();
 }
}
function optionButtons(opts){return '<div class="options">'+opts.map(function(o,i){return '<button class="opt" data-id="'+esc(o.id)+'" data-value="'+esc(o.value)+'"><span class="key">'+(i+1)+'</span>'+esc(o.value)+'</button>'}).join("")+'</div>'}
function respond(ok,chosen){
 if(answered)return;answered=true;var x=current.item,p=prog();p[x.id]=ok?Math.min(GOAL,p[x.id]+1):0;save(screen);
 var buttons=app.querySelectorAll(".opt");buttons.forEach(function(b){b.disabled=true;var good=screen==="pronouns"?b.dataset.value===x.answer:b.dataset.id===x.id;if(good)b.classList.add("correct");else if(b.dataset.id===chosen||b.dataset.value===chosen)b.classList.add("wrong");else b.classList.add("dim")});
 var input=document.getElementById("answerInput");if(input){input.disabled=true;input.classList.add(ok?"correct":"wrong")}
 var mastered=ok&&p[x.id]>=GOAL,answer=screen==="pronouns"?x.answer:x.english;
 var message=mastered?"<strong>¡Dominado!</strong> Completaste 10 seguidas.":ok?"<strong>¡Correcto!</strong> Racha: "+p[x.id]+"/"+GOAL+".":"<strong>La respuesta era “"+esc(answer)+"”.</strong> Su contador vuelve a 0.";
 var tip=screen==="pronouns"?x.tip:(esc(current.example.en)+" · "+esc(current.example.es));
 document.getElementById("feedback").innerHTML='<div class="fb"><div><div class="'+(ok?"good":"bad")+'">'+message+'</div><div class="tip">'+tip+'</div></div><button class="primary" id="nextBtn">Siguiente →</button></div>';
 document.getElementById("nextBtn").focus();renderRail();
}
function renderRail(){
 var rail=document.getElementById("rail");if(!rail)return;var list=items(),p=prog(),done=list.filter(function(x){return p[x.id]>=GOAL}).length;
 var html='<h3>Progreso</h3><p class="summary"><b>'+done+'</b> de <b>'+list.length+'</b> dominados</p>',lastCat="";
 list.forEach(function(x){var cat=screen==="pronouns"?x.cat:"Modales y auxiliares";if(cat!==lastCat){html+='<div class="cat">'+esc(cat)+'</div>';lastCat=cat}var n=p[x.id],isDone=n>=GOAL;html+='<div class="prow'+(isDone?" done":"")+'"><span class="word" title="'+esc(screen==="pronouns"?x.label:x.english)+'">'+esc(screen==="pronouns"?x.label:x.english)+'</span><span class="bar"><i style="width:'+Math.round(n/GOAL*100)+'%"></i></span><span class="cnt">'+(isDone?"✓":n+"/"+GOAL)+'</span></div>'});rail.innerHTML=html;
}
function renderDone(){shell('<div class="done"><div class="trophy">🏆</div><h2>¡Todo dominado!</h2><p>Completaste 10 aciertos seguidos en cada '+(screen==="pronouns"?"pronombre":"modal y auxiliar")+'.</p><button class="primary" id="againBtn">Practicar otra vez</button></div>',screen==="pronouns"?"Pronombres":"Modales y auxiliares")}
function reset(){
 if(!confirm("¿Borrar el progreso de esta sección y empezar de cero?"))return;
 var p=prog();items().forEach(function(x){p[x.id]=0});save(screen);lastId=null;next();
}
app.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.go==="home"){home();return}
 if(b.dataset.open==="pronouns"){start("pronouns");return}
 if(b.dataset.open==="modals"){modalMenu();return}
 if(b.dataset.mode){start("modals",b.dataset.mode);return}
 if(b.classList.contains("opt")){var ok=screen==="pronouns"?b.dataset.value===current.item.answer:b.dataset.id===current.item.id;respond(ok,b.dataset.id||b.dataset.value);return}
 if(b.id==="nextBtn"){next();return}
 if(b.id==="againBtn"){var p=prog();items().forEach(function(x){p[x.id]=0});save(screen);lastId=null;next()}
});
app.addEventListener("submit",function(e){if(e.target.id!=="answerForm")return;e.preventDefault();var v=document.getElementById("answerInput").value;if(!v.trim())return;respond(normalize(v)===normalize(current.example.answer)||accepted(current.item,v),v)});
document.addEventListener("keydown",function(e){if(e.key>="1"&&e.key<="9"&&!answered){var bs=app.querySelectorAll(".opt"),i=+e.key-1;if(bs[i]){e.preventDefault();bs[i].click()}}else if((e.key==="Enter"||e.key===" ")&&answered&&document.getElementById("nextBtn")){e.preventDefault();next()}});
document.getElementById("brandBtn").addEventListener("click",home);resetBtn.addEventListener("click",reset);
var themeBtn=document.getElementById("themeBtn");themeBtn.addEventListener("click",function(){var root=document.documentElement,d=root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),n=d==="dark"?"light":"dark";root.dataset.theme=n;localStorage.setItem("englishDrill.theme",n)});var savedTheme=localStorage.getItem("englishDrill.theme");if(savedTheme)document.documentElement.dataset.theme=savedTheme;
Promise.all([fetch("./frases.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw Error("frases.json");return r.json()}),fetch("./modales.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw Error("modales.json");return r.json()})]).then(function(data){pronounData=data[0];modalData=data[1];GOAL=modalData.goal||10;load(KEYS.pronouns,progress.pronouns,pronounData.pronouns);load(KEYS.modals,progress.modals,modalData.items);home()}).catch(function(e){app.innerHTML='<div class="card error"><strong>No se pudieron cargar los datos.</strong><p>Abre la app desde un servidor web, no con doble clic.</p><small>'+esc(e.message)+'</small></div>'});
if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
var promptEvent=null,installBtn=document.getElementById("installBtn");addEventListener("beforeinstallprompt",function(e){e.preventDefault();promptEvent=e;installBtn.hidden=false});installBtn.addEventListener("click",function(){if(promptEvent){promptEvent.prompt();promptEvent.userChoice.finally(function(){promptEvent=null;installBtn.hidden=true})}});
})();
</script>
</body>
</html>
