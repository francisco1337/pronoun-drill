<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronoun Drill · Práctica de pronombres</title>
<meta name="description" content="Práctica de pronombres en inglés: 10 aciertos seguidos dominan un pronombre; 1 error reinicia su contador.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#5b5bd6">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root {
    --paper:#f7f8fb;--card:#fff;--ink:#1b1f2a;--muted:#6b7280;--faint:#9aa2b1;--line:#e6e8ef;--line-strong:#d3d7e2;
    --iris:#5b5bd6;--iris-soft:#eceafb;--good:#16a34a;--good-soft:#e7f6ec;--bad:#dc2626;--bad-soft:#fbebeb;--amber:#d97706;
    --shadow:0 1px 2px rgba(27,31,42,.06),0 12px 32px rgba(27,31,42,.07);--radius:14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#14161c;--card:#1c1f27;--ink:#e9ebf1;--muted:#9aa2b1;--faint:#6b7280;--line:#2a2e39;--line-strong:#363b48;
      --iris:#8b8bf0;--iris-soft:#23233a;--good:#4ade80;--good-soft:#17301f;--bad:#f87171;--bad-soft:#331a1a;--amber:#fbbf24;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{--paper:#f7f8fb;--card:#fff;--ink:#1b1f2a;--muted:#6b7280;--faint:#9aa2b1;--line:#e6e8ef;--line-strong:#d3d7e2;--iris:#5b5bd6;--iris-soft:#eceafb;--good:#16a34a;--good-soft:#e7f6ec;--bad:#dc2626;--bad-soft:#fbebeb;--amber:#d97706;--shadow:0 1px 2px rgba(27,31,42,.06),0 12px 32px rgba(27,31,42,.07);}
  :root[data-theme="dark"]{--paper:#14161c;--card:#1c1f27;--ink:#e9ebf1;--muted:#9aa2b1;--faint:#6b7280;--line:#2a2e39;--line-strong:#363b48;--iris:#8b8bf0;--iris-soft:#23233a;--good:#4ade80;--good-soft:#17301f;--bad:#f87171;--bad-soft:#331a1a;--amber:#fbbf24;--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35);}

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1080px; margin:0 auto; padding:28px 20px calc(64px + env(safe-area-inset-bottom)); }

  header.top { display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .brand h1 { font-size:1.35rem; margin:0; letter-spacing:-.01em; }
  .brand p { margin:3px 0 0; color:var(--muted); font-size:.85rem; }
  .brand .accent { color:var(--iris); }
  .tools { display:flex; gap:8px; }
  .toolbtn {
    font:inherit; font-size:.8rem; color:var(--muted); cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:7px 12px; display:inline-flex; align-items:center; gap:6px;
  }
  .toolbtn:hover { border-color:var(--line-strong); color:var(--ink); }
  .toolbtn:focus-visible { outline:2px solid var(--iris); outline-offset:2px; }
  .toolbtn[hidden] { display:none; }

  .grid { display:grid; grid-template-columns:1fr 340px; gap:20px; align-items:start; }
  @media (max-width:860px) { .grid { grid-template-columns:1fr; } }

  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 26px 24px; }
  .qhead { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
  .role-pill { font-size:.74rem; font-weight:600; letter-spacing:.02em; color:var(--iris); background:var(--iris-soft); padding:5px 11px; border-radius:999px; }
  .streak-badge { font-size:.78rem; color:var(--muted); display:inline-flex; align-items:center; gap:7px; font-variant-numeric:tabular-nums; }
  .streak-dots { display:inline-flex; gap:3px; }
  .streak-dots i { width:8px; height:8px; border-radius:50%; background:var(--line-strong); display:block; }
  .streak-dots i.on { background:var(--iris); }

  .sentence { font-family:Georgia,"Times New Roman",serif; font-size:1.7rem; line-height:1.42; letter-spacing:-.005em; margin:4px 0 26px; text-wrap:balance; }
  @media (max-width:520px) { .sentence { font-size:1.42rem; } }
  .blank { display:inline-block; min-width:2.4em; text-align:center; border-bottom:3px solid var(--iris); color:var(--iris); padding:0 .12em; margin:0 .04em; font-style:italic; font-weight:700; }
  .blank.filled { border-bottom-color:currentColor; font-style:normal; }
  .sentence .es { display:block; font-family:system-ui,sans-serif; font-size:.92rem; color:var(--faint); margin-top:10px; font-style:italic; }

  .options { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (max-width:520px) { .options { grid-template-columns:1fr; } }
  .opt { font:inherit; font-size:1.05rem; text-align:left; cursor:pointer; background:var(--card); color:var(--ink); border:1.5px solid var(--line-strong); border-radius:11px; padding:13px 16px; transition:border-color .12s,background .12s,transform .05s; display:flex; align-items:center; gap:10px; }
  .opt .key { font-size:.72rem; color:var(--faint); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-variant-numeric:tabular-nums; }
  .opt:hover:not(:disabled) { border-color:var(--iris); }
  .opt:active:not(:disabled) { transform:translateY(1px); }
  .opt:focus-visible { outline:2px solid var(--iris); outline-offset:2px; }
  .opt:disabled { cursor:default; }
  .opt.correct { border-color:var(--good); background:var(--good-soft); color:var(--good); font-weight:600; }
  .opt.wrong { border-color:var(--bad); background:var(--bad-soft); color:var(--bad); font-weight:600; }
  .opt.dim { opacity:.5; }

  .feedback { margin-top:20px; min-height:46px; display:flex; align-items:center; }
  .fb-inner { display:flex; align-items:center; gap:12px; width:100%; }
  .fb-msg { font-size:.92rem; } .fb-msg strong { font-weight:700; }
  .fb-good { color:var(--good); } .fb-bad { color:var(--bad); }
  .fb-tip { color:var(--muted); font-size:.86rem; }
  .nextbtn { margin-left:auto; font:inherit; font-size:.9rem; font-weight:600; cursor:pointer; background:var(--iris); color:#fff; border:none; border-radius:10px; padding:10px 20px; }
  .nextbtn:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }

  .rail { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 18px 20px; }
  .rail h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 4px; }
  .rail .summary { font-size:.84rem; color:var(--muted); margin:0 0 16px; font-variant-numeric:tabular-nums; }
  .rail .summary b { color:var(--ink); }
  .catgroup { margin-bottom:14px; }
  .catgroup .cat-label { font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); margin:0 0 7px; }
  .prow { display:flex; align-items:center; gap:9px; padding:3px 0; }
  .prow .word { font-family:Georgia,serif; font-size:.95rem; width:92px; flex:none; }
  .prow.done .word { color:var(--good); }
  .bar { flex:1; height:7px; background:var(--line); border-radius:999px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--iris); border-radius:999px; width:0; transition:width .3s ease; }
  .prow.done .bar > span { background:var(--good); }
  .prow .cnt { width:34px; flex:none; text-align:right; font-size:.76rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  .prow.done .cnt { color:var(--good); }
  .prow.active .word { color:var(--iris); font-weight:700; }

  .done-banner { text-align:center; padding:20px; }
  .done-banner .big { font-size:2rem; font-family:Georgia,serif; margin-bottom:6px; }
  .loading, .errbox { padding:40px 20px; text-align:center; color:var(--muted); }
  .errbox code { background:var(--iris-soft); color:var(--iris); padding:2px 6px; border-radius:5px; font-size:.85em; }

  .hint-note { font-size:.78rem; color:var(--faint); margin-top:18px; line-height:1.5; }
  kbd { font-family:system-ui; font-size:.72rem; background:var(--card); border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:5px; padding:1px 6px; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Pronoun <span class="accent">Drill</span></h1>
      <p>10 aciertos seguidos dominan un pronombre · 1 error reinicia su contador</p>
    </div>
    <div class="tools">
      <button class="toolbtn" id="installBtn" hidden title="Instalar como app">⬇ Instalar</button>
      <button class="toolbtn" id="resetBtn" title="Borrar todo el progreso">↺ Reiniciar</button>
    </div>
  </header>

  <div class="grid">
    <main class="card" id="quizCard"><div class="loading">Cargando frases…</div></main>
    <aside class="rail" id="rail"></aside>
  </div>

  <p class="hint-note">Responde con el ratón o con las teclas <kbd>1</kbd>–<kbd>4</kbd>. Avanza con <kbd>Enter</kbd> o <kbd>Espacio</kbd>. Tu progreso se guarda en este dispositivo. Para añadir frases, edita <kbd>frases.json</kbd>.</p>
</div>

<script>
(function () {
  "use strict";
  var STORE_KEY = "pronounDrill.v1";
  var GOAL = 10, GROUPS = {}, P = [], CAT_ORDER = [], byId = {};
  var streaks = {}, current = null, answered = false, lastId = null;
  var quizCard = document.getElementById("quizCard");
  var rail = document.getElementById("rail");

  function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;} return a; }

  // ---- Carga de datos ----
  fetch("./frases.json", { cache: "no-cache" })
    .then(function (r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(init)
    .catch(function (e){
      quizCard.innerHTML =
        '<div class="errbox"><p><strong>No se pudieron cargar las frases.</strong></p>' +
        '<p>Si abriste el archivo con doble clic (<code>file://</code>), el navegador bloquea la carga del JSON. ' +
        'Ábrelo desde un servidor (GitHub Pages, o <code>npx serve</code> en la carpeta).</p>' +
        '<p style="font-size:.8rem;opacity:.7">Detalle: ' + escapeHtml(e.message) + '</p></div>';
    });

  function init(data){
    GOAL = data.goal || 10;
    GROUPS = data.groups || {};
    P = data.pronouns || [];
    CAT_ORDER = data.catOrder || [];
    P.forEach(function(p){ byId[p.id]=p; streaks[p.id]=0; });
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      P.forEach(function(p){ if(typeof saved[p.id]==="number") streaks[p.id]=Math.max(0,Math.min(GOAL,saved[p.id]|0)); });
    } catch(e){}
    newQuestion();
  }

  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(streaks)); }catch(e){} }
  function pending(){ return P.filter(function(p){ return streaks[p.id]<GOAL; }); }

  function buildOptions(p){
    var pool=(GROUPS[p.group]||[p.answer]).slice();
    if(pool.indexOf(p.answer)===-1) pool.push(p.answer);
    return shuffle(pool);
  }

  function newQuestion(){
    var pool=pending();
    if(pool.length===0){ current=null; renderDone(); renderRail(); return; }
    var choices=pool;
    if(pool.length>1 && lastId) choices=pool.filter(function(p){return p.id!==lastId;});
    var p=choices[Math.floor(Math.random()*choices.length)];
    lastId=p.id;
    var sen=p.sentences[Math.floor(Math.random()*p.sentences.length)];
    current={ p:p, sentence:sen, options:buildOptions(p) };
    answered=false;
    renderQuiz(); renderRail();
  }

  function renderBlank(text, fill){
    var parts=String(text).split("___");
    return parts.map(escapeHtml).join('<span class="blank'+(fill?" filled":"")+'">'+(fill?escapeHtml(fill):"?")+'</span>');
  }

  function renderQuiz(){
    var p=current.p, sen=current.sentence, dots="";
    for(var i=0;i<GOAL;i++) dots+='<i class="'+(i<streaks[p.id]?"on":"")+'"></i>';
    var html='';
    html+='<div class="qhead">';
    html+= '<span class="role-pill">'+escapeHtml(p.label)+' · '+escapeHtml(p.role)+'</span>';
    html+= '<span class="streak-badge">Racha <span class="streak-dots">'+dots+'</span> '+streaks[p.id]+'/'+GOAL+'</span>';
    html+='</div>';
    html+='<div class="sentence">'+renderBlank(sen.en,null)+'<span class="es">'+escapeHtml(sen.es)+'</span></div>';
    html+='<div class="options">';
    current.options.forEach(function(opt,idx){
      html+='<button class="opt" data-opt="'+escapeHtml(opt)+'"><span class="key">'+(idx+1)+'</span>'+escapeHtml(opt)+'</button>';
    });
    html+='</div><div class="feedback" id="feedback"></div>';
    quizCard.innerHTML=html;
    Array.prototype.forEach.call(quizCard.querySelectorAll(".opt"),function(b){
      b.addEventListener("click",function(){ choose(b.getAttribute("data-opt")); });
    });
  }

  function choose(opt){
    if(answered||!current) return;
    answered=true;
    var p=current.p, correct=(opt===p.answer);
    Array.prototype.forEach.call(quizCard.querySelectorAll(".opt"),function(b){
      b.disabled=true;
      var v=b.getAttribute("data-opt");
      if(v===p.answer) b.classList.add("correct");
      else if(v===opt) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    var blank=quizCard.querySelector(".blank");
    if(blank){ blank.textContent=p.answer; blank.classList.add("filled"); }

    if(correct) streaks[p.id]=Math.min(GOAL,streaks[p.id]+1);
    else streaks[p.id]=0;
    save();

    var fb=document.getElementById("feedback");
    var mastered=correct && streaks[p.id]>=GOAL, msg, cls;
    if(mastered){ msg='<strong>¡Dominado!</strong> 10 seguidas de <strong>'+escapeHtml(p.label)+'</strong>. 🎉'; cls="fb-good"; }
    else if(correct){ msg='<strong>¡Correcto!</strong> Racha de <strong>'+escapeHtml(p.label)+'</strong>: '+streaks[p.id]+'/'+GOAL+'.'; cls="fb-good"; }
    else { msg='<strong>La respuesta era “'+escapeHtml(p.answer)+'”.</strong> El contador de <strong>'+escapeHtml(p.label)+'</strong> vuelve a 0.'; cls="fb-bad"; }
    fb.innerHTML='<div class="fb-inner"><div><div class="fb-msg '+cls+'">'+msg+'</div><div class="fb-tip">'+escapeHtml(p.tip)+'</div></div><button class="nextbtn" id="nextBtn">Siguiente →</button></div>';
    var nb=document.getElementById("nextBtn");
    nb.addEventListener("click",newQuestion); nb.focus();
    renderRail();
  }

  function renderDone(){
    quizCard.innerHTML='<div class="done-banner"><div class="big">🏆 ¡Todos dominados!</div><p>Completaste 10 aciertos seguidos en los '+P.length+' pronombres. Excelente trabajo.</p><button class="nextbtn" id="againBtn" style="margin:10px auto 0;">Practicar otra vez</button></div>';
    document.getElementById("againBtn").addEventListener("click",function(){
      P.forEach(function(p){ streaks[p.id]=0; }); save(); lastId=null; newQuestion();
    });
  }

  function renderRail(){
    var doneCount=P.filter(function(p){return streaks[p.id]>=GOAL;}).length;
    var html='<h2>Progreso</h2><p class="summary"><b>'+doneCount+'</b> de <b>'+P.length+'</b> dominados</p>';
    CAT_ORDER.forEach(function(cat){
      var items=P.filter(function(p){return p.cat===cat;});
      if(!items.length) return;
      html+='<div class="catgroup"><p class="cat-label">'+escapeHtml(cat)+'</p>';
      items.forEach(function(p){
        var done=streaks[p.id]>=GOAL, active=current&&current.p.id===p.id&&!done, pct=Math.round((streaks[p.id]/GOAL)*100);
        html+='<div class="prow'+(done?" done":"")+(active?" active":"")+'"><span class="word">'+escapeHtml(p.label)+'</span><span class="bar"><span style="width:'+pct+'%"></span></span><span class="cnt">'+(done?"✓":streaks[p.id]+"/"+GOAL)+'</span></div>';
      });
      html+='</div>';
    });
    rail.innerHTML=html;
  }

  document.addEventListener("keydown",function(e){
    if(e.key>="1"&&e.key<="9"&&current&&!answered){
      var idx=parseInt(e.key,10)-1;
      if(idx<current.options.length){ e.preventDefault(); choose(current.options[idx]); }
    } else if((e.key==="Enter"||e.key===" ")&&answered){
      if(document.getElementById("nextBtn")){ e.preventDefault(); newQuestion(); }
    }
  });

  document.getElementById("resetBtn").addEventListener("click",function(){
    if(!confirm("¿Borrar todo tu progreso y empezar de cero?")) return;
    P.forEach(function(p){ streaks[p.id]=0; }); save(); lastId=null; newQuestion();
  });

  // ---- PWA: service worker + botón instalar ----
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); });
  }
  var deferredPrompt=null, installBtn=document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); deferredPrompt=e; installBtn.hidden=false; });
  installBtn.addEventListener("click",function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function(){ deferredPrompt=null; installBtn.hidden=true; });
  });
  window.addEventListener("appinstalled",function(){ installBtn.hidden=true; });
})();
</script>
</body>
</html>
