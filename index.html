<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>English Drill · Entrenamiento de inglés</title>
  <meta name="description" content="Practica inglés por niveles con teoría, ejercicios, progreso local y repaso espaciado.">
  <meta name="theme-color" content="#5b5bd6">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <button class="brand" id="brandBtn" type="button">
        <h1>English <b>Drill</b></h1>
        <p>Aprende · practica · repasa</p>
      </button>
      <div class="tools">
        <button class="tool" id="installBtn" type="button" hidden>↓ Instalar</button>
        <button class="tool" id="settingsBtn" type="button" title="Configuración" aria-label="Configuración">⚙</button>
        <button class="tool" id="themeBtn" type="button" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
        <button class="tool" id="resetBtn" type="button" hidden>↻ Reiniciar</button>
      </div>
    </header>
    <main id="app" aria-live="polite">
      <div class="card loading">Cargando contenido…</div>
    </main>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
